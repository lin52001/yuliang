name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify host and tag
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag and package versions do not match");'
      - run: npm run check
      - run: npm test
      - run: npm run check:codex
      - run: npm run build:mac
      - run: npm run release:mac
      - uses: actions/upload-artifact@v7
        with:
          name: yuliang-macos-${{ matrix.arch }}
          path: dist-release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified archives
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: yuliang-macos-*
          path: dist-release
          merge-multiple: true
      - name: Verify both archives and write checksums
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const names = ['arm64', 'x86_64'].map(arch => `Yuliang-v${p.version}-macOS-${arch}.zip`);
          const sums = names.map(name => `${crypto.createHash('sha256').update(fs.readFileSync(`dist-release/${name}`)).digest('hex')}  ${name}`);
          fs.writeFileSync('dist-release/SHA256SUMS', sums.join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=v${p.version}\n`);
          NODE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist-release/*.zip dist-release/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist-release/*.zip dist-release/SHA256SUMS --target "$GITHUB_SHA" --title "余量 $RELEASE_TAG" --notes-file CHANGELOG.md --repo "$GITHUB_REPOSITORY"
          fi
